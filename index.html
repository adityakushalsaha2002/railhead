<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Railhead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --navy: #18222e;      /* night timetable board */
  --flap: #f2c230;      /* departure-board yellow */
  --enamel: #f3f4f0;    /* enamel station sign */
  --red: #d6392c;       /* signal danger */
  --green: #36b26a;     /* signal clear */
  --ballast: #8c9196;
  /* menu surfaces: enamel sign by day */
  --surface: #f3f4f0; --surface-2: #e4e6e1; --ink: #18222e; --ink-2: #4b5560; --line: rgba(24,34,46,.18); --focus: #18222e; --accent-ink: #18222e;
  --veil: linear-gradient(90deg, rgba(243,244,240,.9) 0%, rgba(243,244,240,.55) 38%, rgba(243,244,240,0) 70%);
  --sans: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #18222e; --surface-2: #213040; --ink: #eef0ea; --ink-2: #a9b2bb; --line: rgba(238,240,234,.16); --focus: #f2c230; --accent-ink: #18222e;
    --veil: linear-gradient(90deg, rgba(14,20,28,.88) 0%, rgba(14,20,28,.5) 38%, rgba(14,20,28,0) 70%);
  }
}
:root[data-theme="dark"] {
  --surface: #18222e; --surface-2: #213040; --ink: #eef0ea; --ink-2: #a9b2bb; --line: rgba(238,240,234,.16); --focus: #f2c230; --accent-ink: #18222e;
  --veil: linear-gradient(90deg, rgba(14,20,28,.88) 0%, rgba(14,20,28,.5) 38%, rgba(14,20,28,0) 70%);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: #0e141b; color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.safe { position: absolute; inset: 0; padding: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-right, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 20px); pointer-events: none; }

/* ---------------- boot */
#boot { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: #0e141b; color: #eef0ea; transition: opacity .8s ease; }
#boot.done { opacity: 0; pointer-events: none; }
.boot-in { width: min(420px, 82vw); }
.boot-name { font-family: var(--mono); font-weight: 700; font-size: 34px; letter-spacing: .12em; color: var(--flap); margin: 0 0 18px; }
.boot-track { height: 4px; background: rgba(238,240,234,.14); overflow: hidden; }
.boot-fill { height: 100%; background: var(--flap); transform-origin: left; transform: scaleX(0); transition: transform .25s ease; }
.boot-msg { margin: 12px 0 0; font-size: 15px; color: #a9b2bb; min-height: 1.4em; line-height: 1.45; }
#boot.failed .boot-fill { background: var(--red); }
#boot.failed .boot-msg { color: #eef0ea; }

/* ---------------- HUD (always over the 3D view, so it stays light-on-dark) */
#hud { color: #f3f4f0; font-family: var(--sans); opacity: 0; transition: opacity .4s ease; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
#hud.on { opacity: 1; }
.h-compass { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; width: min(440px, 64vw); height: 40px; transform: translateX(-50%); overflow: hidden;
  mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.h-compass-track { position: absolute; top: 0; left: 0; height: 20px; will-change: transform; }
.h-compass-track span { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: rgba(243,244,240,.55); }
.h-compass-track span.cardinal { color: #f3f4f0; font-weight: 800; font-size: 14px; }
.h-compass-tick { position: absolute; left: 50%; top: 19px; width: 2px; height: 7px; background: var(--flap); transform: translateX(-50%); }
.h-compass-deg { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); font: 600 10px var(--mono); color: rgba(243,244,240,.6); }
.h-compass-markers { position: absolute; inset: 0; }
.h-marker { position: absolute; top: 0; left: 0; transform: translateX(0); font: 700 11px var(--mono); color: var(--accent-ink); background: var(--flap); padding: 1px 5px 0; margin-left: -18px; white-space: nowrap; text-shadow: none; }
.h-marker[data-kind="exit"] { background: var(--green); color: #0d1a12; }
.h-marker.edge { opacity: .7; }
.h-obj { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: calc(env(safe-area-inset-left, 0px) + 22px); max-width: min(34ch, 38vw); }
.h-obj-k { display: block; font-size: 12px; color: rgba(243,244,240,.7); margin-bottom: 2px; }
.h-obj-t { display: block; font-size: 17px; font-weight: 800; line-height: 1.25; }
.h-pips { display: flex; gap: 6px; margin-top: 8px; }
.h-pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(54,178,106,.7); }
.h-pips i.done { background: var(--red); box-shadow: 0 0 6px rgba(214,57,44,.7); }
.h-tally { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 22px); font: 700 18px var(--mono); color: var(--flap); }
.h-cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: opacity .12s; }
.h-cross i { position: absolute; left: 0; top: 0; background: #f3f4f0; box-shadow: 0 0 2px rgba(0,0,0,.8); }
.h-cross .c-t, .h-cross .c-b { width: 2px; height: 9px; }
.h-cross .c-l, .h-cross .c-r { width: 9px; height: 2px; }
.h-cross .c-dot { width: 2px; height: 2px; transform: translate(-50%, -50%); }
.h-hit { position: absolute; left: 50%; top: 50%; opacity: 0; }
.h-hit.on { opacity: 1; }
.h-hit i { position: absolute; width: 10px; height: 2px; background: #f3f4f0; left: -5px; top: -1px; }
.h-hit i:nth-child(1) { transform: rotate(45deg) translateX(-12px); } .h-hit i:nth-child(2) { transform: rotate(135deg) translateX(-12px); }
.h-hit i:nth-child(3) { transform: rotate(225deg) translateX(-12px); } .h-hit i:nth-child(4) { transform: rotate(315deg) translateX(-12px); }
.h-hit.crit i { background: var(--flap); } .h-hit.kill i { background: var(--red); width: 14px; left: -7px; }
.h-dmg { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.h-dmg i { position: absolute; left: -60px; top: -170px; width: 120px; height: 170px; transform-origin: 60px 170px; }
.h-dmg i::before { content: ""; position: absolute; left: 0; top: 0; width: 120px; height: 26px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; border-top: 5px solid rgba(214,57,44,.9); filter: drop-shadow(0 0 6px rgba(214,57,44,.8)); }
.h-prompt { position: absolute; left: 50%; top: calc(50% + 64px); transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .15s; }
.h-prompt.on { opacity: 1; }
.h-prompt-t { font-size: 16px; font-weight: 800; }
.h-prompt-bar { margin: 8px auto 0; width: 180px; height: 4px; background: rgba(243,244,240,.25); }
.h-prompt-bar i { display: block; height: 100%; background: var(--flap); transform-origin: left; transform: scaleX(0); }
.h-msg { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-size: 16px; font-weight: 600; text-align: center; max-width: 40ch; opacity: 0; transition: opacity .25s; }
.h-msg.on { opacity: 1; }
.h-warn { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 66px); transform: translateX(-50%); font-weight: 800; font-size: 15px; color: #18222e; background: var(--flap); padding: 4px 10px 2px; opacity: 0; transition: opacity .2s; text-shadow: none; white-space: nowrap; }
.h-warn.on { opacity: 1; }
.h-radio { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); width: min(560px, 80vw); padding: 10px 14px 9px; background: rgba(14,20,28,.72); border-left: 3px solid var(--flap); opacity: 0; transition: opacity .25s; text-shadow: none; }
.h-radio.on { opacity: 1; }
.h-radio-k { font-size: 12px; color: var(--flap); font-weight: 800; }
.h-radio p { margin: 3px 0 0; font-size: 16px; line-height: 1.4; min-height: 1.4em; }
.h-map { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); width: 170px; height: 170px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(243,244,240,.55), 0 4px 14px rgba(0,0,0,.45); opacity: 0; transition: opacity .3s; }
.h-map.on { opacity: .92; }
.h-map canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
.h-map b { position: absolute; left: 50%; top: 50%; font: 800 11px var(--sans); color: #18222e; background: var(--flap); width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; }
body.is-touch .h-map { width: 120px; height: 120px; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); }
@media (max-width: 640px) { .h-map { width: 116px; height: 116px; } }
.h-vitals { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: grid; grid-template-columns: 240px auto; align-items: center; column-gap: 10px; }
.h-health-k { grid-column: 1 / -1; font-size: 12px; color: rgba(243,244,240,.75); margin-bottom: 4px; }
.h-health { position: relative; height: 12px; background: rgba(14,20,28,.55); box-shadow: inset 0 0 0 1px rgba(243,244,240,.25); overflow: hidden; }
.h-health i, .h-health b { position: absolute; inset: 0; transform-origin: left; }
.h-health b { background: rgba(243,244,240,.55); }
.h-health i { background: #36b26a; transition: background-color .25s; }
.h-health i[data-band="good"] { background: #9ad35a; }
.h-health i[data-band="warn"] { background: #f0902a; }
.h-health i[data-band="crit"] { background: #e0332a; }
.h-health-n { font: 700 20px var(--mono); }
.h-zone { grid-column: 1 / -1; font-size: 13px; color: rgba(243,244,240,.75); margin-top: 6px; opacity: 0; transition: opacity .4s; }
.h-zone.on { opacity: 1; }
.h-bp { width: 230px; height: 86px; margin: 0 0 6px auto; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
.h-bp img { display: block; width: 100%; height: 100%; object-fit: contain; }
body.is-touch .h-bp { width: 160px; height: 60px; }
.h-ammo { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); text-align: right; }
.h-ammo-w { display: block; font-size: 13px; color: rgba(243,244,240,.75); }
.h-ammo-row { display: flex; align-items: baseline; gap: 8px; justify-content: flex-end; }
.h-ammo-m { font: 700 36px/1 var(--mono); }
.h-ammo-r { font: 600 16px var(--mono); color: rgba(243,244,240,.7); }
.h-ammo.low .h-ammo-m { color: var(--flap); }

/* ---------------- menus */
#menu { position: absolute; inset: 0; pointer-events: none; font-family: var(--sans); }
#menu.dim::before { content: ""; position: absolute; inset: 0; background: rgba(10,14,20,.45); }
.m-screen { display: none; pointer-events: auto; }
.m-screen.on { display: block; }
.m-title { position: absolute; inset: 0; padding: calc(env(safe-area-inset-top, 0px) + clamp(20px, 6vh, 64px)) 24px calc(env(safe-area-inset-bottom, 0px) + 24px) calc(env(safe-area-inset-left, 0px) + clamp(20px, 5vw, 72px)); background: var(--veil); overflow-y: auto; }
.board { display: inline-block; background: var(--navy); padding: 18px 18px 12px; box-shadow: 0 18px 40px rgba(0,0,0,.35); max-width: 100%; color: #eef0ea; }
.flaprow { display: flex; gap: 2px; }
.flap { position: relative; display: inline-grid; place-items: center; width: 15px; height: 24px; background: #252d36; color: var(--flap); font: 700 15px/1 var(--mono); perspective: 140px; }
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.55); }
.flap b { display: block; font-weight: 700; transform-origin: 50% 50%; }
.flap.flip b { animation: flip .055s linear; }
@keyframes flip { from { transform: rotateX(-80deg); opacity: .4; } to { transform: rotateX(0deg); opacity: 1; } }
.flaprow.big .flap { width: clamp(34px, 6.4vw, 58px); height: clamp(50px, 9.2vw, 84px); font-size: clamp(32px, 6vw, 58px); }
.flaprow.big { gap: 4px; }
.flaprow.small .flap { width: 12px; height: 18px; font-size: 12px; background: transparent; color: #a9b2bb; }
.flaprow.small .flap::after { display: none; }
.flaprow.small.dim .flap { color: #7f8a95; }
.board-sub { display: flex; justify-content: space-between; margin: 12px 0 8px; }
.board-cols { display: grid; grid-template-columns: 6fr 12fr 2fr 8fr; font-size: 11px; color: #7f8a95; padding: 0 8px; margin-bottom: 4px; }
.board-cols span:last-child { text-align: right; }
.board-row { display: block; width: 100%; padding: 6px 8px; margin: 0 0 4px; border: 0; background: transparent; cursor: pointer; text-align: left; border-left: 3px solid transparent; }
.board-row:hover { background: rgba(255,255,255,.04); }
.board-row.on { border-left-color: var(--flap); background: rgba(242,194,48,.08); }
.board-row:not(.on) .flap { color: #c9ced3; }
.m-desc { max-width: 52ch; font-size: 17px; line-height: 1.5; margin: 22px 0 16px; color: var(--ink); }
.m-diff { display: inline-flex; border: 1px solid var(--line); margin-bottom: 18px; }
.m-diff button { border: 0; background: transparent; padding: 9px 16px 7px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
.m-diff button.on { background: var(--ink); color: var(--surface); }
.m-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.m-actions.col { flex-direction: column; align-items: stretch; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 11px 18px 9px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--flap); color: #18222e; border-color: var(--flap); font-weight: 800; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 7px 12px 5px; font-size: 14px; }
.m-hint { margin: 16px 0 0; font-size: 14px; color: var(--ink-2); max-width: 52ch; }
.m-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, 88vw); background: var(--surface); color: var(--ink); padding: 26px 24px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.m-h { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.m-line { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
.m-stats { margin: 14px 0 20px; display: grid; gap: 8px; }
.m-stats div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.m-stats dt { color: var(--ink-2); } .m-stats dd { margin: 0; font-weight: 700; font-family: var(--mono); }
.m-dead .m-h { color: var(--red); }
.m-ticket { border-top: 6px solid var(--flap); }
.ticket-head { display: flex; justify-content: space-between; font: 600 12px var(--mono); color: var(--ink-2); margin-bottom: 14px; }
.m-rating { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; padding: 10px 12px 8px; background: var(--navy); color: #eef0ea; }
.m-rating span { font-size: 13px; color: #a9b2bb; } .m-rating b { font: 700 20px var(--mono); color: var(--flap); }
.m-location { background: var(--navy); width: auto; padding: 14px 18px; top: 22%; }
.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, 92vw); max-height: min(640px, 86vh); overflow-y: auto; background: var(--surface); color: var(--ink); pointer-events: auto; box-shadow: 0 24px 60px rgba(0,0,0,.45); z-index: 5; }
#menu.panel-open::before { content: ""; position: absolute; inset: 0; background: rgba(10,14,20,.45); pointer-events: auto; }
.panel-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; padding: 8px 12px 6px; cursor: pointer; font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--flap); }
.panel-b { padding: 8px 18px 20px; }
.panel-b h3 { font-size: 15px; margin: 18px 0 8px; }
.row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row .lbl { font-weight: 600; }
.row input[type=range] { width: min(200px, 40vw); accent-color: var(--flap); }
.row output { font: 600 13px var(--mono); min-width: 4ch; text-align: right; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); grid-column: 2 / 4; }
.seg button { border: 0; background: transparent; padding: 7px 10px 5px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--surface); }
.toggle { grid-column: 2 / 4; justify-self: end; border: 1px solid var(--line); background: transparent; padding: 6px 14px 4px; cursor: pointer; min-width: 64px; }
.toggle[aria-checked="true"] { background: var(--ink); color: var(--surface); }
.note { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
.link { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; color: var(--ink); font-weight: 600; }
.keys { margin: 0; display: grid; gap: 6px; }
.keys div { display: flex; justify-content: space-between; gap: 14px; font-size: 14px; }
.keys dt { color: var(--ink-2); } .keys dd { margin: 0; text-align: right; }
kbd { font: 600 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; padding: 1px 5px 0; margin-left: 2px; }

.m-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.m-row .m-diff { margin-bottom: 0; }
.m-row-k { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.m-credit { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); font-weight: 600; }
.m-armory { position: absolute; inset: 0; padding: calc(env(safe-area-inset-top, 0px) + clamp(20px, 5vh, 48px)) 24px calc(env(safe-area-inset-bottom, 0px) + 24px) calc(env(safe-area-inset-left, 0px) + clamp(20px, 5vw, 72px)); background: var(--veil); overflow-y: auto; }
.arm-panel { max-width: 400px; background: var(--surface); color: var(--ink); padding: 22px 20px 20px; box-shadow: 0 18px 40px rgba(0,0,0,.3); }
.arm-tabs { margin: 6px 0 4px; border-bottom: 1px solid var(--line); }
.arm-k { font-size: 14px; margin: 14px 0 8px; color: var(--ink-2); }
.arm-count { margin: 12px 0 0; font-size: 13px; color: var(--ink-2); }
.arm-slot[hidden] { display: none; }
.arm-list { display: grid; gap: 6px; }
.arm-opt { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); border-left: 3px solid transparent; background: transparent; padding: 9px 12px 7px; cursor: pointer; }
.arm-opt b { font-size: 15px; } .arm-opt span { font-size: 13px; color: var(--ink-2); }
.arm-opt:hover { background: var(--surface-2); }
.arm-opt.on { border-left-color: var(--flap); background: var(--surface-2); }
.arm-panel .m-actions { margin-top: 18px; }
@media (max-width: 640px) { .m-armory { padding-top: 46vh; background: linear-gradient(180deg, transparent 0 40%, var(--surface) 46%); } .arm-panel { box-shadow: none; } }
.h-scope { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent 36vmin, rgba(0,0,0,.6) 36.4vmin, #000 37.5vmin); }
.h-scope i { position: absolute; left: 50%; top: 50%; background: rgba(0,0,0,.85); }
.h-scope .sc-h { width: 72vmin; height: 1px; transform: translate(-50%, -50%); box-shadow: 0 0 0 .5px rgba(0,0,0,.4); }
.h-scope .sc-v { width: 1px; height: 72vmin; transform: translate(-50%, -50%); }
.h-scope .sc-dot { width: 4px; height: 4px; border-radius: 50%; background: #e23a2a; transform: translate(-50%, -50%); box-shadow: 0 0 4px #e23a2a; }
.h-scope.x8 .sc-h { width: 72vmin; height: 1px; } .h-scope.x8 .sc-dot { width: 3px; height: 3px; }
#hud.scoped .h-cross { opacity: 0 !important; }

<body>

      <button class="t-btn" data-a="jump">Jump</button><button class="t-btn" data-a="melee">Melee</button>

  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
// ---------------------------------------------------------------- core
// Shared helpers every module leans on: math, a tiny event bus, a seeded RNG,
// quality tiers and persisted settings. Nothing here touches the DOM or WebGL.
const T = THREE;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const sat = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = sat((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const damp = (cur, target, rate, dt) => target + (cur - target) * Math.exp(-rate * dt);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const V3 = (x = 0, y = 0, z = 0) => new T.Vector3(x, y, z);
const lin = hex => new T.Color(hex).convertSRGBToLinear();
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const reducedMotion = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeEvents() {
  const map = new Map();
  return {
    on(name, fn) { if (!map.has(name)) map.set(name, []); map.get(name).push(fn); return () => this.off(name, fn); },
    off(name, fn) { const l = map.get(name); if (!l) return; const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); },
    emit(name, data) {
      const l = map.get(name); if (!l) return;
      for (let i = 0; i < l.length; i++) {
        try { l[i](data); } catch (e) { console.error('[events] "' + name + '" handler threw', e); }
      }
    }
  };
}

// mulberry32 with a few conveniences; fork() gives independent streams per module
function makeRng(seed = 1) {
  let s = seed >>> 0;
  const r = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (a, b) => a + (b - a) * r();
  r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.sign = () => (r() < 0.5 ? -1 : 1);
  r.fork = () => makeRng(Math.floor(r() * 4294967296));
  return r;
}

// Critically damped-ish spring used for every viewmodel channel and camera kick.
// k = natural frequency (rad/s), z = damping ratio.
function spring(k, z) { return { x: 0, v: 0, k, z }; }
function stepSpring(s, target, dt) {
  // substep so stiff springs stay stable at low frame rates
  const n = dt > 1 / 90 ? Math.ceil(dt * 90) : 1, h = dt / n, w = s.k;
  for (let i = 0; i < n; i++) { s.v += (w * w * (target - s.x) - 2 * s.z * w * s.v) * h; s.x += s.v * h; }
  return s.x;
}

// ---- geometry helpers shared by the level, characters and weapons
// a box with rounded edges and corners and smooth normals (real objects rarely have razor edges)
function roundBox(w, h, d, r = 0.02) {
  const g = new T.BoxGeometry(w, h, d, 4, 4, 4), p = g.attributes.position, n = g.attributes.normal, hw = w / 2, hh = h / 2, hd = d / 2;
  r = Math.min(r, hw, hh, hd);
  const fit = (c, half) => { const f = c / half; return Math.abs(f) > 0.75 ? Math.sign(f) * half : Math.abs(f) > 0.25 ? Math.sign(f) * (half - r) : 0; };
  for (let i = 0; i < p.count; i++) {
    const x = fit(p.getX(i), hw), y = fit(p.getY(i), hh), z = fit(p.getZ(i), hd);
    const ix = clamp(x, -(hw - r), hw - r), iy = clamp(y, -(hh - r), hh - r), iz = clamp(z, -(hd - r), hd - r);
    let dx = x - ix, dy = y - iy, dz = z - iz; const l = Math.hypot(dx, dy, dz);
    if (l > 1e-6) { dx /= l; dy /= l; dz /= l; p.setXYZ(i, ix + dx * r, iy + dy * r, iz + dz * r); n.setXYZ(i, dx, dy, dz); } else p.setXYZ(i, x, y, z);
  }
  return g;
}
// place a geometry: position, rotation (x, y, z) and scale, returned as a new geometry
function placed(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const g = geo.clone(); g.applyMatrix4(new T.Matrix4().compose(new T.Vector3(x, y, z), new T.Quaternion().setFromEuler(new T.Euler(rx, ry, rz)), new T.Vector3(sx, sy, sz))); return g;
}
// a round bar from point a to point b, optionally tapered
function tubeGeo(a, b, r0, r1 = r0, seg = 8) {
  const d = new T.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]), len = d.length(), g = new T.CylinderGeometry(r1, r0, len, seg, 1);
  g.translate(0, len / 2, 0); g.applyMatrix4(new T.Matrix4().makeRotationFromQuaternion(new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize()))); g.translate(a[0], a[1], a[2]); return g;
}
// merge several geometries into one mesh's worth (positions, normals, uvs)
function mergeGeos(list) {
  const gs = list.map(g => g.index ? g.toNonIndexed() : g); let n = 0; for (const g of gs) n += g.attributes.position.count;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2); let o = 0;
  for (const g of gs) { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2); o += g.attributes.position.count; }
  const out = new T.BufferGeometry(); out.setAttribute('position', new T.BufferAttribute(pos, 3)); out.setAttribute('normal', new T.BufferAttribute(nor, 3)); out.setAttribute('uv', new T.BufferAttribute(uv, 2));
  out.computeBoundingSphere(); return out;
}

const QUALITY = {
  low:    { name: 'low',    scale: 0.7,  msaa: 0, shadow: 1024, tex: 256, bloom: false, lamps: 2, snow: 700,  softShadow: false, ao: 0,  cloudOct: 3, foliage: 0.5 },
  medium: { name: 'medium', scale: 0.9,  msaa: 0, shadow: 2048, tex: 512, bloom: true, lamps: 3, snow: 1400, softShadow: true, ao: 6,  cloudOct: 4, foliage: 0.8 },
  high:   { name: 'high',   scale: 1,    msaa: 0, shadow: 4096, tex: 512, bloom: true, lamps: 6, snow: 2200, softShadow: true, ao: 10, cloudOct: 5, foliage: 1 }
};

function detectQuality(force) {
  if (force && QUALITY[force]) return { ...QUALITY[force] };
  const mobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 900);
  if (mobile) return { ...QUALITY.low };
  let gpu = '';
  try {
    const c = document.createElement('canvas'), gl = c.getContext('webgl2') || c.getContext('webgl');
    if (gl) {
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      gpu = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
      const lose = gl.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext();
    }
  } catch (e) {}
  if (/SwiftShader|llvmpipe|Software|Mali|Adreno|PowerVR/i.test(gpu) || (/Intel/i.test(gpu) && !/Arc/i.test(gpu))) return { ...QUALITY.medium };
  return { ...QUALITY.high };
}

const SETTINGS_KEY = 'railhead.settings.v1';
const SETTINGS_DEFAULT = { quality: 'auto', sens: 1, invertY: false, volume: 0.8, fov: 75, difficulty: 'standard', mode: 'mission', atmosphere: 'dusk', showVision: true };
function loadSettings() {
  const s = { ...SETTINGS_DEFAULT };
  try {
    const raw = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (raw && typeof raw === 'object') {
      if (['auto', 'low', 'medium', 'high'].includes(raw.quality)) s.quality = raw.quality;
      if (Number.isFinite(raw.sens)) s.sens = clamp(raw.sens, 0.2, 3);
      s.invertY = !!raw.invertY;
      if (typeof raw.showVision === 'boolean') s.showVision = raw.showVision;
      if (Number.isFinite(raw.volume)) s.volume = clamp(raw.volume, 0, 1);
      if (Number.isFinite(raw.fov)) s.fov = clamp(raw.fov, 60, 100);
      if (['standard', 'hard', 'brutal'].includes(raw.difficulty)) s.difficulty = raw.difficulty;
      if (['mission', 'holdout', 'stealth'].includes(raw.mode)) s.mode = raw.mode;
      if (['day', 'dusk', 'night', 'fog'].includes(raw.atmosphere)) s.atmosphere = raw.atmosphere;
    }
  } catch (e) {}
  return s;
}
function saveSettings(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {} }

// Shared scratch vectors (never hold references to these across frames)
const _v1 = V3(), _v2 = V3(), _v3 = V3(), _v4 = V3();

// ---------------------------------------------------------------- materials
// Every surface is baked at load from code: colour, normal (derived from a height
// field) and roughness/metalness. Noise is periodic, so tiled textures repeat seamlessly.
function createNoise(seed) {
  const r = makeRng(seed);
  const P = new Uint16Array(512);
  for (let i = 0; i < 256; i++) P[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const wrap = (i, p) => ((i % p) + p) % p;
  const h2 = (x, y, s) => P[(P[(x & 255)] + (y & 255) + (s & 255)) & 511] / 255;
  // value noise with quintic fade, periodic over (px, py) lattice cells
  function vn(x, y, px, py, s = 0) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    const x0 = wrap(ix, px), x1 = wrap(ix + 1, px), y0 = wrap(iy, py), y1 = wrap(iy + 1, py);
    const a = h2(x0, y0, s), b = h2(x1, y0, s), c = h2(x0, y1, s), d = h2(x1, y1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  // fbm over tile coords u,v in [0,1); fx/fy are integer base frequencies so it tiles
  function fbm(u, v, fx, fy, oct = 4, s = 0) {
    let a = 0.5, sum = 0, tot = 0;
    for (let i = 0; i < oct; i++) { sum += a * vn(u * fx, v * fy, fx, fy, s + i * 17); tot += a; a *= 0.5; fx *= 2; fy *= 2; }
    return sum / tot;
  }
  // periodic worley: returns F1, F2 and the nearest cell id in out[0..2]
  const wout = [0, 0, 0];
  function worley(u, v, f, s = 0) {
    const x = u * f, y = v * f, ix = Math.floor(x), iy = Math.floor(y);
    let d1 = 9, d2 = 9, id = 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const cx = wrap(ix + ox, f), cy = wrap(iy + oy, f);
      const px = ix + ox + h2(cx, cy, s), py = iy + oy + h2(cx, cy, s + 91);
      const dx = px - x, dy = py - y, d = dx * dx + dy * dy;
      if (d < d1) { d2 = d1; d1 = d; id = h2(cx, cy, s + 37); } else if (d < d2) d2 = d;
    }
    wout[0] = Math.sqrt(d1); wout[1] = Math.sqrt(d2); wout[2] = id;
    return wout;
  }
  return { vn, fbm, worley, h2 };
}

function createMats(G) {
  const N = G.quality.tex;
  const nz = createNoise(4207 + (+G.params.tseed || 0));
  const renderer = G.render.renderer;
  const aniso = Math.min(16, renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1);
  const stats = { bakes: 0, ms: 0 };
  const cache = new Map();

  // ---- bake: fn(u, v, o) fills o = {r,g,b (sRGB 0..1), h (0..1), ro, me}
  function bake(w, h, fn, { bump = 2, tile = true, post = null } = {}) {
    const t0 = performance.now();
    const H = new Float32Array(w * h), C = new Float32Array(w * h * 3), R = new Uint8ClampedArray(w * h * 2);
    const o = { r: 0, g: 0, b: 0, h: 0.5, ro: 0.8, me: 0 };
    for (let y = 0; y < h; y++) {
      const v = 1 - (y + 0.5) / h; // canvas top row = v≈1 (CanvasTexture flips)
      for (let x = 0; x < w; x++) {
        o.h = 0.5; o.ro = 0.8; o.me = 0;
        fn((x + 0.5) / w, v, o);
        const i = y * w + x;
        H[i] = o.h; C[i * 3] = o.r; C[i * 3 + 1] = o.g; C[i * 3 + 2] = o.b;

      }
    });
  }

  function tankSkin() {
    const W = N * 2, H = N / 2;
    return bake(W, H, (u, v, o) => {
      const p = nz.fbm(u, v, 24, 6, 4, 110);
      const drip = smooth(0.55, 0.8, nz.fbm(u, v, 80, 2, 2, 111)) * smooth(0.55, 0.95, Math.abs(v - 0.5) * 2 < 0.4 ? 0 : 1);
      const band = smooth(0.012, 0.004, Math.abs(((u * 4) % 1) - 0.5) - 0.49);
      setC(o, hex(0x2f3134), 0.85 + 0.3 * p);
      fadeC(o, 0.15 + 0.2 * nz.fbm(u, v, 12, 4, 3, 112));
      mixC(o, hex(0x4b3f33), drip * 0.6);
      mixC(o, DUST, smooth(0.3, 0.0, Math.abs(v - 0.5) * 2 > 0.55 ? 0.4 - Math.abs(v - 0.5) * 0.4 : 1) * 0.0 + 0.22 * smooth(0.5, 0.8, nz.fbm(u, v, 20, 3, 3, 113)));

      o.h = 0.5 + band * 0.4; o.ro = 0.45 + p * 0.25 + drip * 0.2; o.me = 0.2;
    }, {
      tile: false, bump: 2,
      post: (cx, w, h) => {
        stencil(cx, 'RHTX 30872', w * 0.08, h * 0.42, h * 0.11);
        stencil(cx, 'DO NOT HUMP', w * 0.62, h * 0.42, h * 0.08, { weight: 700 });
        // hazard diamond
        cx.save(); cx.translate(w * 0.45, h * 0.36); cx.rotate(Math.PI / 4);
        const s = h * 0.13; cx.fillStyle = 'rgba(198,58,40,.92)'; cx.fillRect(-s / 2, -s / 2, s, s);
        cx.strokeStyle = 'rgba(235,230,220,.9)'; cx.lineWidth = s * 0.06; cx.strokeRect(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8);
        cx.restore();
        weather(cx, w, h, 0.7, 112);

    });
  }

  function drumSkin() {
    const W = N, H = N / 2;
    return bake(W, H, (u, v, o) => {
      const rib = smooth(0.03, 0.01, Math.abs(v - 0.33)) + smooth(0.03, 0.01, Math.abs(v - 0.67));
      const p = nz.fbm(u, v, 8, 4, 4, 120), rust = smooth(0.62, 0.78, nz.fbm(u, v, 6, 3, 4, 121));
      setC(o, hex(0xa3271c), 0.82 + 0.3 * p);
      mixC(o, hex(0x5a3020), rust);
      o.h = 0.4 + rib * 0.5; o.ro = 0.5 + rust * 0.4; o.me = 0.2 * (1 - rust);
    }, {
      tile: false, bump: 2.5,
      post: (cx, w, h) => {
        for (let k = 0; k < 2; k++) {
          cx.save(); cx.translate(w * (0.25 + k * 0.5), h * 0.5); cx.rotate(Math.PI / 4);
          const s = h * 0.22; cx.fillStyle = 'rgba(236,204,56,.9)'; cx.fillRect(-s / 2, -s / 2, s, s); cx.restore();
          stencil(cx, 'FLAMMABLE', w * (0.25 + k * 0.5), h * 0.86, h * 0.07, { align: 'center', color: 'rgba(240,236,226,.85)' });
        }
        weather(cx, w, h, 0.6, 122);
      }
    });
  }

  // platform slabs: large concrete flags with joints, wear and the odd stain
  R.platform = () => bake(N, N, (u, v, o) => {
    const fx = (u * 4) % 1, fy = (v * 4) % 1, joint = Math.min(smooth(0, 0.012, fx), smooth(0, 0.012, 1 - fx), smooth(0, 0.012, fy), smooth(0, 0.012, 1 - fy));
    const id = nz.h2(Math.floor(u * 4), Math.floor(v * 4), 140), g = grain(u, v, 144), m = nz.fbm(u, v, 18, 18, 4, 141), stain = nz.fbm(u + (m - 0.5) * 0.06, v, 6, 6, 4, 142);
    const jd = 1 - Math.min(smooth(0, 0.07, fx), smooth(0, 0.07, 1 - fx), smooth(0, 0.07, fy), smooth(0, 0.07, 1 - fy));
    setC(o, hex(0x96938b), 0.9 + 0.08 * id + 0.1 * m + 0.1 * (g - 0.5));
    mulC(o, 1 - 0.16 * smooth(0.5, 0.74, stain) - 0.1 * jd * nz.fbm(u, v, 24, 24, 2, 145));
    mulC(o, 0.5 + 0.5 * joint);
    const gum = nz.worley(u, v, 22, 143); if (gum[2] > 0.94 && gum[0] < 0.07) mulC(o, 0.72);
    o.h = 0.4 + 0.5 * joint + m * 0.06 + (g - 0.5) * 0.08; o.ro = 0.86 - 0.14 * smooth(0.55, 0.75, stain);
  }, { bump: 2.2 });
  R.coping = () => bake(N / 2, N / 2, (u, v, o) => { const m = nz.fbm(u, v, 8, 8, 4, 150); setC(o, hex(0xb8b3a6), 0.85 + 0.2 * m); o.h = 0.5 + m * 0.2; o.ro = 0.85; }, { bump: 1.4 });
  R.tactile = () => bake(N, N / 8, (u, v, o) => {
    const gx = (u * 96) % 1 - 0.5, gy = (v * 4) % 1 - 0.5, d = Math.hypot(gx * 1, gy), bump = smooth(0.32, 0.2, d);
    const m = nz.fbm(u, v, 32, 4, 3, 160);
    setC(o, hex(0xd2a62a), 0.75 + 0.25 * m); mulC(o, 0.82 + 0.18 * bump); o.h = 0.3 + 0.6 * bump; o.ro = 0.7;
  }, { tile: false, bump: 3 });
  // passenger coach side: 18 m x 2.9 m, two-tone livery, ten windows, doors at both ends
  function coachSkin() {
    const W = N * 2, H = Math.round(N / 3), L = 18, Ht = 2.9;
    const wins = []; for (let i = 0; i < 10; i++) wins.push(2.55 + i * 1.3);
    const inWin = (mx, my) => { for (const c of wins) if (Math.abs(mx - c) < 0.5 && my > 1.4 && my < 2.18) return c; return 0; };
    const doors = [0.55, L - 1.45];
    const set = bake(W, H, (u, v, o) => {
      const mx = u * L, my = v * Ht, p = nz.fbm(u, v, 30, 5, 4, 170);
      const band = my > 1.28 && my < 2.32, door = doors.some(d => mx > d && mx < d + 0.9);
      setC(o, band ? hex(0xd8cdb0) : hex(0x23463a), 0.9 + 0.15 * p);
      if (Math.abs(my - 1.24) < 0.025 || Math.abs(my - 2.36) < 0.02) setC(o, hex(0xb6302a), 0.95);
      let h = 0.5 + p * 0.05;
      const w = inWin(mx, my);
      if (w) { const ry = (my - 1.4) / 0.78; setC(o, [0.1 + 0.1 * ry, 0.13 + 0.12 * ry, 0.16 + 0.14 * ry]); o.ro = 0.08; o.me = 0.3; h = 0.2; }
      else { o.ro = 0.45 + p * 0.2; o.me = 0.1; }
      if (door) { const edge = doors.some(d => Math.abs(mx - d) < 0.025 || Math.abs(mx - d - 0.9) < 0.025) || my < 0.06 || Math.abs(my - 2.6) < 0.02; if (edge) { mulC(o, 0.35); h = 0.25; } if (my > 1.55 && my < 2.15 && doors.some(d => mx > d + 0.22 && mx < d + 0.68)) { setC(o, [0.12, 0.15, 0.18]); o.ro = 0.08; h = 0.2; } }
      if (Math.abs(((mx + 0.65) % 1.3) - 0.65) < 0.01 && !band) h -= 0.08;
      const grime = smooth(0.7, 0.98, 1 - v) * 0.35 + smooth(0.62, 0.8, nz.fbm(u, v, 60, 3, 2, 171)) * 0.15;
      mulC(o, 1 - grime);
      o.h = h;
    }, { tile: false, bump: 2.4, post: (cx, w, h) => { const ppm = w / L; stencil(cx, 'RH 3104', 1.8 * ppm, h * 0.86, h * 0.08, { color: 'rgba(216,205,176,.9)', weight: 700 }); stencil(cx, '2', 9.0 * ppm, h * 0.86, h * 0.09, { color: 'rgba(216,205,176,.9)' }); weather(cx, w, h, 0.4, 172); } });
    // emissive map: warm interior light behind each window
    const ec = document.createElement('canvas'); ec.width = W; ec.height = H; const ex = ec.getContext('2d');
    ex.fillStyle = '#000'; ex.fillRect(0, 0, W, H);
    const px = W / L, py = H / Ht;
    for (const c of wins) { const g = ex.createLinearGradient(0, H - 2.18 * py, 0, H - 1.4 * py); g.addColorStop(0, '#ffd9a0'); g.addColorStop(1, '#c98a4a'); ex.fillStyle = g; ex.fillRect((c - 0.5) * px, H - 2.18 * py, px, 0.78 * py); }
    const et = new T.CanvasTexture(ec); et.encoding = T.sRGBEncoding;
    set.emissiveMap = et;
    return set;
  }

  // woven cloth: twill weave, soft wrinkles, and a three-tone disruptive pattern when weave > 1
  R.fabric = (color, weave = 1) => bake(N / 2, N / 2, (u, v, o) => {
    const w = 0.5 + 0.25 * (Math.sin((u + v) * TAU * 80) + Math.sin((u - v) * TAU * 80)), p = nz.fbm(u, v, 8, 8, 4, 180 + weave), fold = nz.fbm(u, v, 3, 6, 3, 185 + weave);
    setC(o, hex(color), 0.84 + 0.2 * p + 0.07 * w);
    if (weave > 1) { const c = hex(color), c1 = smooth(0.5, 0.53, nz.fbm(u, v, 4, 4, 3, 190 + weave)), c2 = smooth(0.6, 0.63, nz.fbm(u, v, 6, 6, 3, 195 + weave)); mixC(o, [c[0] * 0.5, c[1] * 0.52, c[2] * 0.5], c1 * 0.75); mixC(o, [Math.min(1, c[0] * 1.5 + 0.05), Math.min(1, c[1] * 1.4 + 0.04), c[2] * 1.2], c2 * 0.55); }
    mulC(o, 0.9 + 0.2 * (fold - 0.5));
    o.h = 0.5 + w * 0.1 + (fold - 0.5) * 0.45; o.ro = 0.9;
  }, { bump: 1.7 });
  R.bark = () => bake(N / 2, N / 2, (u, v, o) => {
    const ridge = nz.fbm(u, v, 22, 3, 3, 240), fine = nz.fbm(u, v, 60, 12, 2, 241), crack = smooth(0.42, 0.5, ridge);
    setC(o, hex(0x8a735c), 0.55 + 0.6 * crack + 0.15 * fine); mixC(o, hex(0x5d6a48), smooth(0.6, 0.8, nz.fbm(u, v, 4, 4, 3, 242)) * 0.35);
    o.h = 0.2 + crack * 0.6 + fine * 0.15; o.ro = 0.95;
  }, { bump: 5 });
  R.grass = () => bake(N, N, (u, v, o) => {
    const p = nz.fbm(u, v, 9, 9, 4, 200), b = nz.vn(u * 200, v * 70, 200, 70, 201), b2 = nz.vn(u * 90, v * 220, 90, 220, 203), g = grain(u, v, 204);
    const dry = smooth(0.5, 0.75, nz.fbm(u, v, 5, 5, 4, 202)), bare = smooth(0.7, 0.8, nz.fbm(u, v, 7, 7, 4, 205));
    setC(o, hex(0x3d5229), 0.72 + 0.3 * p + 0.22 * Math.max(b, b2) + 0.08 * (g - 0.5));
    mixC(o, hex(0x6f6a40), dry * 0.5); mixC(o, hex(0x4f4536), bare * 0.6);
    o.h = 0.35 + Math.max(b, b2) * 0.55 - bare * 0.2; o.ro = 0.95;
  }, { bump: 2.6 });
  // asphalt: pale aggregate in dark binder, tar-sealed cracks, oil stains and smooth worn patches that catch the sky
  R.asphalt = () => bake(N, N, (u, v, o) => {
    const g = grain(u, v, 214), w = nz.worley(u, v, 110, 212), ag = smooth(0.3, 0.1, w[0]) * (w[2] > 0.55 ? 1 : 0.25);
    const big = nz.fbm(u, v, 5, 5, 4, 211), mid = nz.fbm(u, v, 20, 20, 3, 210);
    const seal = crackNet(u, v, 3, 213, 0.016);
    const oil = smooth(0.7, 0.86, nz.fbm(u, v, 6, 6, 3, 215)) * 0.6, worn = smooth(0.55, 0.72, nz.fbm(u, v, 3, 3, 4, 216));
    setC(o, hex(0x3a3b3d), 0.8 + 0.2 * mid + 0.16 * (g - 0.5));
    mixC(o, hex(0x8f8d88), ag * (0.28 + 0.22 * worn));
    mulC(o, 1 - 0.14 * smooth(0.5, 0.75, big) - oil * 0.38);
    mixC(o, hex(0x101112), seal * 0.9);
    o.h = 0.5 + ag * 0.22 + (g - 0.5) * 0.1 - seal * 0.15; o.ro = 0.9 - worn * 0.22 - oil * 0.45 - seal * 0.5;
  }, { bump: 1.7 });
  // shipping container side: trapezoid corrugation, faded paint, scrapes, rust creeping from the pressed edges
  R.container = (color) => bake(N / 2, N / 2, (u, v, o) => {
    const t = Math.abs(((u * 8) % 1) - 0.5), prof = smooth(0.13, 0.23, t), slope = prof * (1 - prof) * 4;
    const p = nz.fbm(u, v, 8, 8, 4, 220), g = grain(u, v, 224), rust = rustAt(u, v, 9, 221, 0.7) * (0.6 + 0.4 * slope), sc = scratch(u, v, 223, 40, 5);
    setC(o, hex(color), 0.88 + 0.16 * p + 0.04 * (g - 0.5));
    fadeC(o, 0.2 + 0.2 * smooth(0.4, 0.7, nz.fbm(u, v, 4, 4, 3, 225)));
    mulC(o, 0.8 + 0.2 * prof - 0.1 * slope);
    mulC(o, 1 - 0.16 * smooth(0.5, 0.8, nz.fbm(u, v, 40, 3, 2, 222)));
    mixC(o, hex(0xa09c94), sc * 0.5 * prof);
    mixC(o, rust > 0.6 ? RUST : RUST_L, rust * 0.9);
    o.h = 0.25 + 0.6 * prof + (g - 0.5) * 0.03; o.ro = 0.55 + rust * 0.35 + p * 0.1; o.me = 0.25 * (1 - rust);
  }, { bump: 4.5 });
  // pneumatic tyre: chevron lugs across the tread, plain sidewalls with dust near the ground line
  R.tyre = () => bake(N / 2, N / 4, (u, v, o) => {
    const tread = smooth(0.2, 0.28, v) * smooth(0.8, 0.72, v), lug = smooth(0.42, 0.5, ridge(((u * 30 + Math.abs(v - 0.5) * 5) % 1))) * tread;
    const g = grain(u, v, 250), dust = smooth(0.3, 0.0, Math.abs(v - 0.5) * 2 - 0.55) * 0.0 + 0.3 * nz.fbm(u, v, 6, 3, 3, 251);
    setC(o, hex(0x1b1b1c), 0.85 + 0.25 * g + 0.2 * lug); mixC(o, DUST, dust * (0.5 + 0.5 * tread));
    o.h = 0.35 + lug * 0.55 + (g - 0.5) * 0.05 + (1 - tread) * 0.1 * Math.sin(v * 60); o.ro = 0.92;
  }, { bump: 5 });
  R.water = () => bake(N, N, (u, v, o) => { const p = nz.fbm(u, v, 8, 8, 5, 230); setC(o, hex(0x1d3a44)); o.h = p; o.ro = 0.08; o.me = 0.2; }, { bump: 6 });

  // ---- material factory
  function std(set, opts = {}) {
    const m = new T.MeshStandardMaterial({
      map: set.map, normalMap: set.normalMap, roughnessMap: set.ormMap, metalnessMap: set.ormMap,
      roughness: 1, metalness: opts.metal ? 1 : 0, color: opts.color ? lin(opts.color) : new T.Color(1, 1, 1),
      normalScale: new T.Vector2(opts.ns || 1, opts.ns || 1)

    if (!opts.metal) m.metalnessMap = null;
    if (opts.repeat) for (const t of [set.map, set.normalMap, set.ormMap]) t.repeat.set(opts.repeat[0], opts.repeat[1]);
    if (opts.side) m.side = opts.side;
    if (opts.vertexColors) m.vertexColors = true;
    if (set.emissiveMap) { m.emissiveMap = set.emissiveMap; m.emissive = new T.Color(1, 1, 1); m.emissiveIntensity = 1; }
    return m;
  }

// ---------------------------------------------------------------- architecture kit
// Built the way the real things are: windows sit in frames with mullions, a sill and a
// lintel; doors have jambs, a head, hinges, a lever and a kick plate; portacabins have
// skirting, corner trims, an overhanging roof, a gutter and a downpipe.
function makeArch(ctx) {
  const { add, box, BOX, M, phys, dyn, winM, G } = ctx;

  const glassDark = new T.MeshStandardMaterial({ color: lin(0x1b242c), roughness: 0.06, metalness: 0.85 });
  // placement: o = { x, y, z, ry }; local +z points out of the wall, local +x to the right when facing it
  const at = (o, lx, lz) => { const c = Math.cos(o.ry), s = Math.sin(o.ry); return [o.x + lx * c + lz * s, o.z - lx * s + lz * c]; };

function createPlayer(G) {

      if (G.enemies) G.enemies.damageRadius(pos, radius, dmg * 1.4);
      for (const dr of G.level.drums) if (dr.alive && dr.fuse < 0 && dr.pos.distanceTo(pos) < radius * 0.7) dr.fuse = 0.15 + Math.random() * 0.25;

  return C;
}

  }

  applyDifficulty(G.settings.difficulty);
  G.weapon.setVisible(false);
  H.show(false); I.setGameplay(false);
  setState('title');
  if (!G.params.autostart && !G.params.shot) { ui.show('title'); titleLife(); }
  return { get state() { return st.state; }, st, sx, start, pause, resume, toTitle, update, applyDifficulty };
}

// ---------------------------------------------------------------- cutscenes
// Opening: a utility helicopter flies in low, hovers over the drop point, and the player
// fast-ropes down (first person) before it climbs away. Ending: the shunting engine sounds
// its horn and pulls out of the junction towards the quay. Any key, click or tap skips.
function createCinema(G) {
  const M = G.mats, scene = G.render.scene, cam = G.render.camera;
  const _a = V3(), _b = V3(), _c = V3();
  const ease = t => t * t * (3 - 2 * t), easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);

  // ---- helicopter, modelled on a medium utility helicopter: rounded cabin with a glazed nose,
  // sliding side door, engine housing over the cabin, four-blade main rotor, tapered tail boom
  // with fin, stabiliser and two-blade tail rotor, landing skids on cross tubes
  const heli = (() => {
    const g = new T.Group(); g.visible = false; scene.add(g);
    const body = M.get('heli'), dark = M.get('darkmetal'), steel = M.get('steel');
    const glass = new T.MeshStandardMaterial({ color: lin(0x0e1418), roughness: 0.05, metalness: 0.8 });
    const mesh = (geo, mat, x, y, z, o = {}) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); if (o.rx) m.rotation.x = o.rx; if (o.ry) m.rotation.y = o.ry; if (o.rz) m.rotation.z = o.rz; if (o.s) m.scale.set(...o.s); m.castShadow = true; (o.p || g).add(m); return m; };
    // cabin: a lathe along the length (nose at -z), squashed a little at the sides
    const prof = [[0, -4.2], [0.55, -4.05], [0.95, -3.6], [1.18, -2.9], [1.28, -1.8], [1.3, 0.4], [1.24, 1.6], [1.02, 2.5], [0.62, 3.2]].map(([r, z]) => new T.Vector2(r, z));
    const cab = mesh(new T.LatheGeometry(prof, 24), body, 0, 0, 0, { rx: Math.PI / 2, s: [0.86, 1, 1] }); cab.rotation.x = -Math.PI / 2;
    mesh(new T.SphereGeometry(1.0, 20, 12, 0, TAU, 0, Math.PI * 0.42), glass, 0, 0.15, -3.05, { rx: -Math.PI / 2.6, s: [0.95, 0.9, 1.15] });
    for (const sd of [-1, 1]) mesh(new T.PlaneGeometry(0.8, 0.55), glass, sd * 1.105, 0.45, -2.1, { ry: sd * Math.PI / 2 });
    mesh(new T.PlaneGeometry(1.5, 1.25), dark, 1.115, -0.05, -0.3, { ry: Math.PI / 2 });                       // open door
    mesh(new T.BoxGeometry(0.05, 1.3, 1.45), body, 1.13, -0.03, 1.25);                                          // door slid back
    mesh(new T.BoxGeometry(1.5, 0.75, 3.0), body, 0, 1.45, 0.2);                                                // engine housing
    for (const sd of [-1, 1]) mesh(new T.CylinderGeometry(0.22, 0.26, 0.5, 12), dark, sd * 0.55, 1.5, 1.85, { rx: Math.PI / 2 });
    const boom = mesh(new T.CylinderGeometry(0.22, 0.5, 6.4, 14), body, 0, 0.45, 5.6, { rx: Math.PI / 2 });
    mesh(new T.BoxGeometry(0.12, 1.9, 1.2), body, 0, 1.25, 8.55, { rx: -0.35 });
    mesh(new T.BoxGeometry(2.4, 0.08, 0.6), body, 0, 0.4, 8.2);
    mesh(new T.CylinderGeometry(0.11, 0.11, 0.9, 10), dark, 0, 1.95, 0.05);                                      // mast
    const rotor = new T.Group(); rotor.position.set(0, 2.42, 0.05); g.add(rotor);
    mesh(new T.CylinderGeometry(0.3, 0.3, 0.18, 12), dark, 0, 0, 0, { p: rotor });
    for (let i = 0; i < 4; i++) { const b = mesh(new T.BoxGeometry(0.42, 0.05, 7.6), dark, 0, 0, 0, { p: rotor }); b.position.set(Math.sin(i * Math.PI / 2) * 3.9, 0, Math.cos(i * Math.PI / 2) * 3.9); b.rotation.y = i * Math.PI / 2; }
    const blurM = new T.MeshBasicMaterial({ color: 0x15171a, transparent: true, opacity: 0.18, depthWrite: false, side: T.DoubleSide });
    mesh(new T.RingGeometry(0.5, 7.8, 48), blurM, 0, 0.02, 0, { rx: -Math.PI / 2, p: rotor }).castShadow = false;
    const trotor = new T.Group(); trotor.position.set(0.18, 1.4, 8.85); g.add(trotor);
    for (let i = 0; i < 2; i++) mesh(new T.BoxGeometry(0.03, 1.5, 0.16), dark, 0, 0, 0, { rz: i * Math.PI / 2, p: trotor });
    for (const sd of [-1, 1]) {
      mesh(new T.CylinderGeometry(0.06, 0.06, 4.2, 8), steel, sd * 1.05, -1.65, -0.2, { rx: Math.PI / 2 });
      for (const z of [-1.2, 0.9]) mesh(new T.CylinderGeometry(0.05, 0.05, 0.9, 6), steel, sd * 0.88, -1.25, z, { rz: sd * 0.45 });
    }
    const navR = new T.MeshBasicMaterial({ color: lin(0xff2a1a).multiplyScalar(3), toneMapped: false }), navG = new T.MeshBasicMaterial({ color: lin(0x2aff4a).multiplyScalar(3), toneMapped: false });
    mesh(new T.SphereGeometry(0.07, 8, 6), navR, -1.2, 0.2, 8.2); mesh(new T.SphereGeometry(0.07, 8, 6), navG, 1.2, 0.2, 8.2);
    const beacon = mesh(new T.SphereGeometry(0.09, 8, 6), new T.MeshBasicMaterial({ color: lin(0xff3020).multiplyScalar(4), toneMapped: false }), 0, -1.32, 1.2);
    // fast rope hanging from the door
    const rope = mesh(new T.CylinderGeometry(0.018, 0.018, 1, 6), M.get('rubber'), 0, 0, 0, { p: scene }); rope.visible = false;
    return { g, rotor, trotor, beacon, rope, door: V3(1.35, -0.4, -0.3) };
  })();

  // ---- overlay: letterbox bars and a skip hint
  const ov = document.createElement('div'); ov.className = 'cine'; ov.innerHTML = '<i></i><i></i><span>Press any key to skip</span>'; document.getElementById('app').appendChild(ov);
  let active = null, t = 0, ht = 0, skip = false, snd = {}, heliAfter = 0;
  const onSkip = () => { if (active && t > 0.6) skip = true; };
  addEventListener('keydown', onSkip); addEventListener('mousedown', onSkip); addEventListener('touchstart', onSkip, { passive: true });
  const stopSnd = () => { for (const k in snd) if (snd[k]) snd[k].stop(0.6); snd = {}; };

  // ------------------------------------------------ opening drop
  const intro = { S: V3(), yaw: 0, out: V3(), side: V3(), A: V3(), H: V3(), E: V3(), camG: V3(), dur: 11.5 };
  function startIntro(sp) {
    const I = intro; I.S.copy(sp.pos); I.yaw = sp.yaw;
    I.out.set(sp.pos.x - 35, 0, sp.pos.z).normalize(); I.side.set(-I.out.z, 0, I.out.x);
    // hover point: the door sits right above the drop point; the helicopter faces back along its approach
    const hy = Math.atan2(I.out.x, I.out.z);              // nose (-z local) points along -out
    _a.copy(heli.door).applyAxisAngle(V3(0, 1, 0), hy);
    I.H.set(I.S.x - _a.x, 13.5, I.S.z - _a.z); I.hy = hy;
    I.A.copy(I.H).addScaledVector(I.out, 150).add(V3(0, 30, 0)).addScaledVector(I.side, -25);
    I.E.copy(I.H).addScaledVector(I.out, -60).addScaledVector(I.side, 120).add(V3(0, 55, 0));
    I.camG.copy(I.S).addScaledVector(I.out, -10).addScaledVector(I.side, 8).setY(1.6);
    heli.g.visible = true; heli.rope.visible = false; heliAfter = 0;
    active = 'intro'; t = 0; skip = false; ov.classList.add('on');
    if (G.audio.ready) snd.heli = G.audio.loop('heli_loop', { pos: I.A, gain: 1.4, ref: 18, roll: 0.7, send: 0.25 });
  }
  function heliPose(dt, t) {
    const I = intro; let p;
    if (t < 5) { const u = easeOut(t / 5); p = _b.copy(I.A).lerp(I.H, u); heli.g.rotation.set(-0.12 + 0.3 * u * (1 - u) * 2, I.hy, 0.05 * Math.sin(t)); }
    else if (t < 9.6) { p = _b.copy(I.H); p.y += Math.sin(t * 1.3) * 0.12; p.x += Math.sin(t * 0.7) * 0.15; heli.g.rotation.set(0.02 * Math.sin(t * 0.9), I.hy, 0.02 * Math.sin(t * 1.1)); }
    else { const u = Math.min(1, (t - 9.6) / 7); p = _b.copy(I.H).lerp(I.E, u * u); heli.g.rotation.set(0.18 * Math.min(1, u * 4), I.hy - u * 0.8, -0.2 * Math.min(1, u * 4)); }
    heli.g.position.copy(p);
    heli.rotor.rotation.y += dt * 28; heli.trotor.rotation.x += dt * 70; heli.beacon.visible = (t % 1) < 0.15;
    if (snd.heli) snd.heli.setPos(p);
    // downwash: dust kicked off the ground under the rotor
    const hgt = p.y; if (hgt < 22 && Math.random() < dt * 30) { const a = Math.random() * TAU, r = 2 + Math.random() * 6; G.fx.smoke(_c.set(p.x + Math.cos(a) * r, 0.2, p.z + Math.sin(a) * r), { size: 0.6, size1: 2.2, life: 1.4, alpha: 0.22 * (1 - hgt / 22), rise: 0.4, spread: 1.6 }); }
  }
  function introCam() {
    const I = intro, door = _a.copy(heli.door).applyAxisAngle(V3(0, 1, 0), I.hy).add(heli.g.position);
    if (t < 5) { cam.position.copy(I.camG); cam.position.y += Math.sin(t * 7) * 0.01; cam.lookAt(heli.g.position.x, heli.g.position.y + 0.5, heli.g.position.z); }
    else if (t < 6.4) {   // sitting in the door, looking down at the drop point
      cam.position.copy(door).addScaledVector(I.side.clone().set(Math.sin(I.hy + Math.PI / 2), 0, Math.cos(I.hy + Math.PI / 2)), -0.6); cam.position.y += 0.3;
      cam.lookAt(I.S.x, 0, I.S.z);
    } else if (t < 9.4) {   // fast-rope down
      const u = ease(Math.min(1, (t - 6.4) / 2.6)), y = lerp(door.y - 0.4, 1.66, u);
      const fx = -Math.sin(I.yaw), fz = -Math.cos(I.yaw);
      cam.position.set(I.S.x - fx * 0.75 + fz * 0.35 + Math.sin(t * 9) * 0.02 * (1 - u), y, I.S.z - fz * 0.75 - fx * 0.35);
      const pitch = lerp(-1.1, -0.05, ease(Math.min(1, (t - 6.4) / 3))), yw = I.yaw;
      cam.lookAt(cam.position.x + fx * Math.cos(pitch), y + Math.sin(pitch), cam.position.z + fz * Math.cos(pitch));
      if (u >= 1 && !intro.landed) { intro.landed = true; G.player.addShake && G.player.addShake(0.35); G.events.emit('player:land', { speed: 6 }); }
    } else { G.player.sync(0); }
    // rope from the door to the ground once the drop starts
    const ropeOn = t > 5.2 && t < 12;
    heli.rope.visible = ropeOn;
    if (ropeOn) { const top = door, bot = _c.set(I.S.x - Math.sin(I.yaw) * 0.0, 0, I.S.z); const len = Math.max(0.5, top.distanceTo(bot)); heli.rope.scale.set(1, len, 1); heli.rope.position.copy(top).add(bot).multiplyScalar(0.5); heli.rope.lookAt(bot); heli.rope.rotateX(Math.PI / 2); }
  }

  // ------------------------------------------------ ending: the engine pulls out
  const outro = { dur: 11 };
  function startOutro() {
    const L = G.level; active = 'outro'; t = 0; skip = false; ov.classList.add('on');
    L.loco.active = true; L.loco.group.position.set(0, 0, 0);
    if (G.audio.ready) snd.diesel = G.audio.loop('diesel_loop', { pos: V3(45, 2, 4), gain: 1.2, ref: 10, roll: 0.8, send: 0.2 });
    outro.horn = false; outro.horn2 = false;
  }
  function locoX() { const tm = Math.max(0, t - 1.8); return 0.45 * tm * tm; }   // 0.9 m/s² from standstill
  function outroUpdate(dt) {
    const L = G.level, lg = L.loco.group, dx = locoX();
    lg.position.x = dx; lg.position.y = -0.3 * smooth(0.5, 4, dx);                     // drops from the yard track onto the quay rails
    const cx = 44.7 + dx, cz = 4;
    if (snd.diesel) snd.diesel.setPos(_a.set(cx, 2, cz));
    if (!outro.horn && t > 0.7) { outro.horn = true; G.audio.play('horn', { pos: _a.set(cx, 4, cz), gain: 1.3, ref: 20, send: 0.4 }); }
    if (!outro.horn2 && t > 6.2) { outro.horn2 = true; G.audio.play('horn', { pos: _a.set(cx, 4, cz), gain: 1.0, ref: 20, send: 0.5, rate: 1.0 }); }
    if (Math.random() < dt * (t > 1.5 ? 14 : 5)) G.fx.smoke(_a.set(41.4 + dx, 4.5, cz), { size: 0.35, size1: 1.6, life: 2.2, alpha: 0.45, rise: 1.6, spread: 0.3 });
    if (t < 4.2) { cam.position.set(36, 2.1, 9.3); cam.lookAt(cx, 2.4, cz); }
    else if (t < 8.4) { cam.position.set(66, 0.9, 1.1); cam.lookAt(Math.min(cx, 64), 2.0, cz); }
    else { const u = (t - 8.4) / 2.6; cam.position.set(56 - u * 3, 7 + u * 3, -9 - u * 2); cam.lookAt(cx, 2, cz); }
  }

  // ------------------------------------------------ shared
  function update(dt) {
    if (heliAfter > 0) { heliAfter -= dt; ht += dt; heliPose(dt, ht); if (heliAfter <= 0) { heli.g.visible = false; heli.rope.visible = false; stopSnd(); } }
    if (!active) return true;
    t += dt;
    const post = G.render.post;
    if (active === 'intro') {
      heliPose(dt, t); introCam();
      post.fade = Math.max(1 - smooth(0, 0.8, t), (t > 6.2 && t < 6.5) ? 0.9 : 0);
      if (skip || t >= intro.dur) { finish(); return true; }
    } else {
      outroUpdate(dt);
      post.fade = Math.max(1 - smooth(0, 0.7, t), smooth(outro.dur - 1.2, outro.dur, t));
      if (skip || t >= outro.dur) { finish(); return true; }
    }
    return false;
  }
  function finish() {
    const was = active; active = null; ov.classList.remove('on');
    if (was === 'intro') {
      // the helicopter keeps climbing away for a few seconds after control returns
      ht = skip ? 9.6 : t;
      heliAfter = 7; heli.rope.visible = false; G.render.post.fade = 0;
    } else { stopSnd(); }
    skip = false;
  }
  function cancel() { active = null; heliAfter = 0; ov.classList.remove('on'); heli.g.visible = false; heli.rope.visible = false; stopSnd(); }
  return { startIntro, startOutro, update, cancel, get active() { return active; } };
}

// ---------------------------------------------------------------- boot
// Modules load in order behind a progress bar. Non-critical modules fall back to
// stubs, so one failure degrades the game instead of stopping it. One loop drives all.
const STUBS = {
  audio: () => ({ init() {}, resume() {}, play() { return null; }, loop() { return null; }, setIntensity() {}, setVolume() {}, update() {}, suspend() {}, ready: false }),
  fx: () => ({ sparks() {}, smoke() {}, impact() {}, muzzle() {}, explosion() {}, tracer() {}, decal() {}, shell() {}, boltGlow() {}, update() {}, reset() {}, colors: {} })
};
async function boot() {
  const params = Object.fromEntries(new URLSearchParams(location.search));
  const errors = []; window.__errors = errors; window.__ready = false;
  addEventListener('error', e => errors.push(String(e.message || e)));
  const bootEl = document.getElementById('boot'), bar = bootEl.querySelector('.boot-fill'), msg = bootEl.querySelector('.boot-msg');
  const G = { params, events: makeEvents(), rng: makeRng(+params.seed || 4207), time: { t: 0, dt: 0, frame: 0 }, settings: loadSettings() };
  window.__G = G;
  G.quality = detectQuality(params.q || (G.settings.quality !== 'auto' ? G.settings.quality : null));
  const fatal = text => { bootEl.classList.add('failed'); msg.textContent = text; };
  const step = async (label, frac, name, fn, stub) => {
    msg.textContent = label; bar.style.transform = 'scaleX(' + frac + ')';
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
    try { return fn(); } catch (e) {
      console.error('[boot] ' + name + ' failed', e); errors.push(name + ': ' + (e && e.message || e));
      if (stub) return STUBS[stub]();
      throw e;
    }
  };
  try {
    G.render = await step('Starting the renderer', 0.04, 'render', () => createRender(G));
  } catch (e) { fatal('This browser couldn’t start WebGL, which Railhead needs. Try a current version of Chrome, Edge, Firefox or Safari.'); return; }
  try {
    G.mats = await step('Mixing the paint', 0.1, 'mats', () => createMats(G));
    G.physics = await step('Surveying the yard', 0.16, 'physics', () => createPhysics(G));
    G.level = await step('Laying ballast and coupling the cars', 0.22, 'level', () => createLevel(G));
    G.fx = await step('Lighting the lamps', 0.5, 'fx', () => createFx(G), 'fx');
    G.audio = await step('Tuning the radio', 0.58, 'audio', () => createAudio(G), 'audio');
    G.input = await step('Checking the controls', 0.7, 'input', () => createInput(G));
    G.player = await step('Lacing boots', 0.74, 'player', () => createPlayer(G));
    G.weapon = await step('Loading the carbine', 0.78, 'weapon', () => createWeapon(G));
    G.combat = createCombat(G);
    G.enemies = await step('Waking the Dispatcher', 0.84, 'enemies', () => createEnemies(G));
    G.hud = await step('Painting the signs', 0.9, 'hud', () => createHud(G));
    G.game = await step('Setting the points', 0.94, 'game', () => createGame(G));
    G.render.setAtmosphere(params.atmo || G.settings.atmosphere);
    await step('Warming up the shaders', 0.98, 'warmup', () => {
      const r = G.render;
      const hidden = [];
      const reveal = root => root.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
      reveal(G.enemies.crows[0].rig.g.parent); for (const k in G.weapon.models) reveal(G.weapon.models[k].root);
      r.renderer.compile(r.scene, r.camera); r.renderer.compile(r.viewScene, r.viewCamera); r.frame(0.016);
      for (const o of hidden) o.visible = false;
      G.weapon.setVisible(true); G.weapon.blueprint('rifle'); G.weapon.blueprint('pistol');
      G.weapon.setVisible(G.game.state !== 'title');
    });
  } catch (e) { fatal('Railhead hit a problem while loading: ' + (e && e.message || e) + '. Reloading the page usually fixes it.'); return; }
  bar.style.transform = 'scaleX(1)';
  bootEl.classList.add('done'); setTimeout(() => bootEl.remove(), 900);

  document.addEventListener('visibilitychange', () => { if (document.hidden && G.game.state === 'playing') G.game.pause(); });
  if (params.mode) G.settings.mode = params.mode === 'holdout' ? 'holdout' : 'mission';
  if (params.diff && DIFFICULTY[params.diff]) G.settings.difficulty = params.diff;
  if (params.autostart || params.shot) G.game.start({ quick: true });

  const warned = new Set();
  const safe = (name, fn) => { try { fn(); } catch (e) { if (!warned.has(name)) { warned.add(name); console.error('[loop] ' + name + ' threw', e); errors.push(name + ': ' + (e && e.message || e)); } } };
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (window.__stop) return;
    let dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (params.shot) dt = 1 / 60;
    G.time.dt = dt; G.time.t += dt; G.time.frame++;
    safe('input', () => G.input.update(dt));
    let s = G.game.state;
    safe('game', () => G.game.update(dt));
    s = G.game.state;
    if (s === 'playing') { safe('player', () => G.player.update(dt)); safe('weapon', () => G.weapon.update(dt)); }
    if (s === 'playing' || s === 'dead' || s === 'complete' || s === 'title' || s === 'intro') safe('enemies', () => G.enemies.update(dt));
    if (s !== 'paused') { safe('fx', () => G.fx.update(dt)); safe('level', () => G.level.update(dt)); }
    if (s === 'playing') safe('hud', () => G.hud.update(dt));
    safe('audio', () => G.audio.update(dt));
    safe('render', () => G.render.frame(s === 'paused' ? 0 : dt));
    G.input.endFrame();
  }
  requestAnimationFrame(frame);
  window.__ready = true;
}
boot();


})();
</script>
